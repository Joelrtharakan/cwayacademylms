services:
  postgres:
    image: postgres:16-alpine
    container_name: cway_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: cway_redis
    restart: always
    volumes:
      - redis_prod:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cway_api
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cway_web
    restart: always
    ports:
      - "3000:3000"

    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "https://api.cwayacademy.com/api/v1"
      NEXT_PUBLIC_APP_URL: "https://www.cwayacademy.com"

  nginx:
    image: nginx:alpine
    container_name: cway_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cway_uptime_kuma
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data

  netdata:
    image: netdata/netdata:stable
    container_name: cway_netdata
    restart: always
    hostname: metrics.cwayacademy.com
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_prod:
  redis_prod:
  uptime-kuma:
  netdata-config:
  netdata-lib:
  netdata-cache:
