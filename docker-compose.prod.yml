services:
  postgres:
    image: postgres:16-alpine
    container_name: cway_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: cway_redis
    restart: always
    volumes:
      - redis_prod:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - apps/api/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"

    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "https://api.cwayacademy.com/api/v1"
      NEXT_PUBLIC_APP_URL: "https://www.cwayacademy.com"

volumes:
  postgres_prod:
  redis_prod:
