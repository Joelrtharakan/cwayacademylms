events {
    worker_connections 1024;
}

http {
    # Define Rate Limiting & Connection Zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Redirect HTTP -> HTTPS for API
    server {
        listen 80;
        server_name api.cwayacademy.com;
        return 301 https://$host$request_uri;
    }

    # Redirect HTTP -> HTTPS for Frontend
    server {
        listen 80;
        server_name www.cwayacademy.com cwayacademy.com;
        return 301 https://$host$request_uri;
    }

    # API HTTPS Server
    server {
        listen 443 ssl;
        server_name api.cwayacademy.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 50M;

        # Production Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Use Docker's internal DNS resolver to resolve containers at runtime
        # Reduce cache TTL to 2s so Nginx immediately picks up the new IP during deployments
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $api_upstream http://api:5000;

        # Authentication Routes (Strict Rate Limiting)
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
            limit_req zone=auth burst=3 nodelay;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # All other API Routes
        location / {
            limit_req zone=api burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Frontend HTTPS Server
    server {
        listen 443 ssl;
        server_name www.cwayacademy.com cwayacademy.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Production Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Use Docker's internal DNS resolver
        # Reduce cache TTL to 2s so Nginx immediately picks up the new IP during deployments
        resolver 127.0.0.11 valid=2s ipv6=off;
        set $web_upstream http://web:3000;

        # Frontend Routes
        location / {
            limit_req zone=general burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
