events {
    worker_connections 1024;
}

http {



    # Redirect HTTP -> HTTPS for API
    server {
        listen 80;
        server_name api.cwayacademy.com;
        return 301 https://$host$request_uri;
    }

    # Redirect HTTP -> HTTPS for Frontend
    server {
        listen 80;
        server_name www.cwayacademy.com cwayacademy.com;
        return 301 https://$host$request_uri;
    }

    # API HTTPS Server
    server {
        listen 443 ssl;
        server_name api.cwayacademy.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        client_max_body_size 50M;

        # Use Docker's internal DNS resolver to resolve containers at runtime
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://cway_api:5000;

        location / {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Frontend HTTPS Server
    server {
        listen 443 ssl;
        server_name www.cwayacademy.com cwayacademy.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $web_upstream http://cway_web:3000;

        location / {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
