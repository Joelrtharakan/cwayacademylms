
services:
  # PostgreSQL database (replaces SQLite in dev)
  postgres:
    image: postgres:16-alpine
    container_name: cway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     cway
      POSTGRES_PASSWORD: cwaydev
      POSTGRES_DB:       cway_lms
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cway -d cway_lms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: cway_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer for Connection Pooling
  pgbouncer:
    image: edoburu/pgbouncer
    container_name: cway_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cway:cwaydev@postgres:5432/cway_lms
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: any
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # pgAdmin (optional, GUI for Postgres)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cway_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@cway.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Automated Weekly Database Backups
  pgbackup:
    image: prodrigestivill/postgres-backup-local
    container_name: cway_pgbackup
    restart: unless-stopped
    user: postgres:postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: cway_lms
      POSTGRES_USER: cway
      POSTGRES_PASSWORD: cwaydev
      # Run backup every week
      SCHEDULE: "@weekly"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - ./db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
