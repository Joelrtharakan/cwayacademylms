name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to deploy to Production"
        required: true
        default: ""

jobs:
  deploy:
    if: github.event.inputs.confirmation == 'DEPLOY'

    runs-on: ubuntu-latest

    steps:
      - name: Check connectivity to VPS
        run: |
          echo "Checking connectivity to ${{ secrets.VPS_HOST }} on port 22..."

          if nc -zvw10 ${{ secrets.VPS_HOST }} 22; then
            echo "✅ VPS is reachable on port 22"
          else
            echo "❌ Cannot reach VPS on port 22"
            exit 1
          fi

      - name: Deploy to Production VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            echo "Connected to VPS"
            hostname
            pwd

            /opt/cway-academy/scripts/deploy.sh

            echo "Deployment completed successfully!"
          EOF